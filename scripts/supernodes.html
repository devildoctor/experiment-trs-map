<script>/* CYTOSCAPE */</script><script>/* COMPARE */</script><script>/* PROJECTION */</script><script>
'use strict';
const data=/* DATA */;
const el=id=>document.getElementById(id), paths=data.paths, nodes=data.graph.nodes;
const expandedSupernodes=new Set(),expandedStates=new Set(),byId=new Map(),anchors=new Map(),positions=new Map();
let projection=null,focusedPathId=null;
const pathColors=new Map(Object.keys(paths).sort().map((p,i)=>[p,'hsl('+Math.round((i*137.508+200)%360)+',62%,40%)']));
const tracks=['A','B'];
const isCompare=()=>el('view').value==='compare';
let focused=null, pairFocus=null;
const selections=()=>tracks.map(t=>({sample:el('sample'+t).value,path:el('path'+t).value}));
const option=(select,value,label)=>select.add(new Option(label,value));
for(const id of ['sample','sampleA','sampleB']){
  option(el(id),'','全部样本');
  for(const s of [...new Set(Object.values(data.samples).flatMap(Object.keys))].sort())option(el(id),s,s);
}
function supported(p,sample){
  return data.path_info[p].role==='reference' || !sample || data.samples[p][sample]?.length>0;
}
function selectPaths(track){
  const select=el('path'+track),previous=select.value;
  select.replaceChildren();option(select,'','选择路径');
  for(const p of Object.keys(paths).filter(p=>supported(p,el('sample'+track).value))){
    option(select,p,p+(data.path_info[p].role==='reference'?' · REF':''));
  }
  if([...select.options].some(o=>o.value===previous))select.value=previous;
}
tracks.forEach(selectPaths);
el('title').textContent=document.title=data.graph.locus+' 重复结构图';
const motifAliases=/* MOTIF ALIASES */;
const motifName=token=>Object.hasOwn(motifAliases,token[0]) && token[3]!=='unknown' && token[4]!=='right_terminal' && token[4]!=='left_terminal'?motifAliases[token[0]]:token[0];
const pattern=n=>n.ordered_pattern.map(motifName).join('·');

function stateLabel(n,v){
  if(n.ordered_pattern[0][3]==='unknown')return '未解析';
  if(n.ordered_pattern[0][3]==='partial')return '部分单元';
  if(v.structure_assessment==='ambiguous')return '结构歧义';
  if(v.boundary_assessment==='ambiguous')return '边界歧义';
  if(n.protected)return n.ordered_pattern[0][4]==='right_terminal'?'末端':v.structure_assessment==='not_assessed'?'未评估':'受保护中断';
  if(v.boundary_assessment!=='invariant_within_model')return '边界未定';
  if(v.position_assessment==='path_local')return '路径局部';
  return '';
}
for(const vs of Object.values(paths)){
  const total=vs.at(-1).original_interval[1];
  for(const v of vs){
    byId.set(v.visit_id,v);
    const bucket=positions.get(v.supernode_id)||[];
    bucket.push((v.original_interval[0]+v.original_interval[1])/(2*total));
    positions.set(v.supernode_id,bucket);
  }
}
for(const [sn,pos] of positions){pos.sort((a,b)=>a-b);anchors.set(sn,pos[Math.floor(pos.length/2)]*6200)}
function updateRange(){
  const keep=new Set(Array.from(el('range').selectedOptions,o=>o.value));
  el('range').replaceChildren();
  for(const p of Object.keys(paths)){
    const ok=supported(p,el('sample').value);
    option(el('range'),p,p+(ok?'':' · 当前样本无支持'));
    const entry=el('range').lastChild;entry.disabled=!ok;entry.selected=keep.has(p);
  }
}
updateRange();
const cy=cytoscape({container:el('canvas'),elements:[],layout:{name:'preset'},minZoom:.009,maxZoom:5,
  style:[
    {selector:'node',style:{'label':'data(label)','width':120,'height':34,'shape':'round-rectangle','background-color':'#528a83','color':'#12343a','text-valign':'bottom','text-margin-y':2,'text-wrap':'wrap','font-size':12,'min-zoomed-font-size':6}},
    {selector:'node[flag="opaque"]',style:{'background-color':'#ad9470','shape':'diamond'}},
    {selector:'node[flag="ambiguous"]',style:{'background-color':'#a190bc','shape':'hexagon'}},
    {selector:'node[flag="unassessed"]',style:{'background-color':'#a4aeb2','shape':'diamond'}},
    {selector:'node[flag="protected"]',style:{'border-width':2,'border-color':'#81515e'}},
    {selector:'node[flag="loss"]',style:{'border-width':4,'border-color':'#cb5a2b'}},
    {selector:'node[flag="child"]',style:{'background-color':'#8ab1b7','shape':'rectangle','font-family':'monospace','width':130}},
    {selector:'edge',style:{'width':1,'curve-style':'bezier','target-arrow-shape':'triangle','line-color':'#b5c6c6','target-arrow-color':'#b5c6c6','opacity':.7}},
    {selector:'edge.correspondence',style:{'line-style':'dashed','width':2,'line-color':'#6b647b','target-arrow-shape':'none','opacity':0.9}},
    {selector:'node',style:{'background-color':'#ecf1f0','color':'#193640','border-color':'#8ba09f','border-width':1,'text-valign':'center','text-margin-y':0,'text-max-width':170,'text-wrap':'ellipsis','width':178,'height':46}},
    {selector:'node.pair',style:{'text-wrap':'wrap','height':58}},
    {selector:'node[view_kind="copy"]',style:{'width':134,'height':58,'font-size':11,'text-max-width':130,'text-wrap':'wrap'}},
    {selector:'node[view_kind="state"]',style:{'width':202,'height':'data(state_height)'}},
    {selector:':parent',style:{'shape':'round-rectangle','padding':'13px','background-color':'#e3eeed','background-opacity':0.45,'text-valign':'top','font-weight':'bold','text-background-opacity':1,'text-background-color':'#f8faf9'}},
    {selector:'node[flag="loss"]',style:{'border-width':3,'border-color':'#bf633d'}},
    {selector:'edge.trace,edge.a,edge.b',style:{'line-color':'data(color)','target-arrow-color':'data(color)','width':2.2,'opacity':0.82}},
    {selector:'edge.trace',style:{'source-endpoint':'data(outlet)','target-endpoint':'data(inlet)'}},
    {selector:'.dim',style:{'opacity':0.12}},
    {selector:'edge.onRoute',style:{'width':4,'opacity':1,'z-index':15}},
    {selector:'node.onRoute',style:{'border-width':3,'border-color':'#203f51','z-index':10}}

  ]});
function layoutOverview(items,graph){
  // Dimensions include Cytoscape's compound padding and both container titles.
  const boxes=[];
  for(const block of graph.blocks.values()){
    const sn=block.sn,leaves=[];
    let width=210,height=70;
    if(!expandedSupernodes.has(sn))leaves.push([summaryId(sn),0,35]);
    else{
      height=52;width=248;
      for(const sid of block.state_ids){
        const state=graph.states.get(sid);
        if(!expandedStates.has(sid)){
          const h=items.get(sid).data.state_height;
          leaves.push([sid,0,height+h/2]);height+=h+30;
          continue;
        }
        height+=48;
        for(const vid of state.member_visit_ids){
          const v=byId.get(vid),n=v.ordered_occurrence_ids.length;
          width=Math.max(width,n*162+90);
          v.ordered_occurrence_ids.forEach((oid,i)=>leaves.push([copyId(vid,oid),(i-(n-1)/2)*162,height+30]));
          height+=84;
        }
        height+=28;
      }
      height+=18;
    }
    boxes.push({sn,x:anchors.get(sn),width,height,leaves});
  }
  // Interval packing, followed by the height of the tallest block in each lane.
  boxes.sort((a,b)=>(a.x-a.width/2)-(b.x-b.width/2)||a.sn.localeCompare(b.sn));
  const lanes=[];
  for(const box of boxes){
    let lane=lanes.find(l=>l.right+32<=box.x-box.width/2);
    if(!lane){lane={height:0,boxes:[]};lanes.push(lane)}
    lane.right=box.x+box.width/2;lane.height=Math.max(lane.height,box.height);lane.boxes.push(box);
  }
  let y=0;
  for(const lane of lanes){
    for(const box of lane.boxes)for(const [id,dx,dy] of box.leaves)items.get(id).position={x:box.x+dx,y:y+dy};
    y+=lane.height+35;
  }
}
function overview(){
  const selected=Array.from(el('range').selectedOptions,o=>o.value);
  projection=projectStateGraph(data,{pathIds:selected.length?selected:null,sample:el('sample').value,
    mode:el('mode').value,expandedSupernodes,expandedStates});
  const items=new Map(),mode=el('mode').value;
  for(const d of projection.nodes.values()){
    const state=projection.states.get(d.state_id),block=projection.blocks.get(d.sn),n=nodes[d.sn];
    let caption=pattern(n),flag='';
    if(d.view_kind==='copy'){
      const motif=motifName(n.ordered_pattern[d.index%n.ordered_pattern.length]);
      caption=(n.ordered_pattern[d.index%n.ordered_pattern.length][3]==='unknown'?d.dna:motif)+'\n'+d.dna.length+'bp';
      if(mode==='represented' && d.changed)flag='loss';
    }else if(state){
      caption+=' ×'+state.repeat_count;
      if(mode==='represented' && state.changed_visit_ids.length)flag='loss';
    }else{
      caption+=' ×{'+block.state_ids.map(id=>projection.states.get(id).repeat_count).join(',')+'}';
      if(n.protected)flag='protected';
    }
    const entry={...d,label:caption,flag};
    if(d.view_kind==='state')entry.state_height=Math.max(60,Math.ceil(6.5*d.port_count+16));
    items.set(d.id,{data:entry});
  }
  layoutOverview(items,projection);
  for(const e of projection.edges)items.set(e.id,{data:{...e,color:pathColors.get(e.path_id)},classes:'trace'});
  apply(items);
  const selector=el('tracePath');selector.replaceChildren();option(selector,'','无');
  for(const p of projection.routes.keys())option(selector,p,p);
  if(!projection.routes.has(focusedPathId))focusedPathId=null;
  selector.value=focusedPathId||'';
  highlight();
  el('meta').textContent=projection.support.path_count+' 条登记路径 · '+projection.support.molecule_count+' 个独立分子';
  el('legend').textContent=projection.routes.size?'彩线按登记路径连接。点击区块展开次数状态，再点击状态查看各次访问的拷贝。':'所选范围内没有当前样本支持的路径，可调整样本或显示路径范围。';
  if(focused)overviewDetail(focused,el('visit').value);
}
function highlight(){
  const p=focusedPathId,ids=new Set();
  if(p){
    for(const v of projection.routes.get(p)||[])for(const id of v.display_node_ids){
      ids.add(id);
      for(let n=projection.nodes.get(id);n?.parent;n=projection.nodes.get(n.parent))ids.add(n.parent);
    }
  }
  cy.batch(()=>cy.elements().forEach(e=>{
    const on=!!p && (e.isEdge()?e.data('path_id')===p:ids.has(e.id()));
    e.toggleClass('onRoute',on);e.toggleClass('dim',!!p && !on);
  }));
}
function apply(items){
  cy.batch(()=>{
    for(const collection of [cy.edges(),cy.nodes()])collection.filter(e=>!items.has(e.id())).remove();
    // The projection inserts containers before their descendants. An edge always follows both endpoints.
    const entries=[...items.values()];
    for(const e of [...entries.filter(e=>!e.data.source),...entries.filter(e=>e.data.source)]){
      let item=cy.getElementById(e.data.id);
      if(item.empty())item=cy.add(e);
      else{
        const {id,parent,source,target,...mutable}=e.data;
        item.data(mutable);item.classes(e.classes||'');
      }
      if(e.position && item.isNode() && !e.data.view_kind?.endsWith('container'))item.position(e.position);
    }
  });
}
function compare(){
  const choices=selections(),support=selectionSupport(choices,data.path_info,data.samples);
  const rows=choices.map(c=>paths[c.path]||[]),same=!!choices[0].path && choices[0].path===choices[1].path;
  const pairs=correspondingVisits(rows[0],rows[1],same), cols=layoutVisits(rows[0].length,rows[1].length,pairs,218);
  const items=new Map(), ids=[[],[]], represented=el('mode').value==='represented';
  function add(e){items.set(e.data.id,e)}
  tracks.forEach((track,k)=>{
    const {path}=choices[k],info=data.path_info[path];
    el('stats'+track).parentElement.style.borderColor=pathColors.get(path)||'#78918f';
    el('stats'+track).textContent=info?[
      support.perTrack[k].length+' 个独立分子',info.length+' bp',
      '实际改写 '+info.edited_bp+' bp（'+(info.fraction*100).toFixed(2)+'%）',
      '预算 '+info.budget_bp+' bp',info.represented_is_observed_whole_sequence?'展示整串见于原始 OBS':'展示整串未见于原始 OBS'
    ].join(' · '):'请选择登记路径';
    rows[k].forEach((v,i)=>{
      const n=nodes[v.supernode_id],id=JSON.stringify([track,path,v.visit_id]),status=stateLabel(n,v);
      const flag=represented && v.loss_event_ids.length?'loss':n.protected?'protected':'';
      ids[k].push(id);
      const symbol=n.ordered_pattern.length>1?'('+pattern(n)+')':pattern(n);
      const caption=[symbol+' ×'+v.repeat_count,status,v.loss_event_ids.length?'改写 '+v.loss_event_ids.length+' bp':''].filter(Boolean).join('\n');
      add({data:{id,track,visit:v.visit_id,sn:n.id,flag,label:caption},classes:'pair '+track.toLowerCase(),
           position:{x:cols[k][i],y:k*175}});
      if(i)add({data:{id:displayId('walk',track,path,i),source:ids[k][i-1],target:id,color:pathColors.get(path)},classes:track.toLowerCase()});
    });
  });
  for(const [i,j] of pairs)add({data:{id:displayId('correspondence',ids[0][i],ids[1][j]),source:ids[0][i],target:ids[1][j]},classes:'correspondence'});
  apply(items);
  el('meta').textContent=support.paths+' 条登记路径 · '+support.molecules+' 个独立分子（并集）';
  const message=choices.some(c=>!c.path)?'请选择 A、B 两行的登记路径':
    same?'虚线为同一登记来源的同一次访问':
    pairs.length?'虚线为当前模型中的结构位置对应（'+pairs.length+' 对）':'对应尚未确定';
  el('legend').textContent=message+'。实线为各行访问顺序；横坐标表示排版位置。';
  if(pairFocus)detail(byId.get(pairFocus.visit).supernode_id,pairFocus.visit,pairFocus.track);
}

const visibleTemplates=new Map(Array.from(document.querySelectorAll('[data-template-bases]'),
  row=>[row.dataset.motif,row.dataset.templateBases]));
const divergencePercent=25;
el('fiveDivergencePercent').textContent=divergencePercent+'%';
const differenceCache=new Map();

// Coordinates are 1-based in the unaligned dictionary row. Insertion k is before template base k.
function templateDifference(template,dna){
  if(template===dna)return {indels:'',edits:0,divergent:false};
  const m=template.length,n=dna.length,stride=n+1;
  // Minimize edit distance, then the number of gap bases.
  const edit=m+n+1,gap=edit+1;
  const cost=new Uint32Array((m+1)*stride);
  for(let i=m;i>=0;i--)for(let j=n;j>=0;j--){
    const k=i*stride+j;
    if(i===m)cost[k]=(n-j)*gap;
    else if(j===n)cost[k]=(m-i)*gap;
    else cost[k]=Math.min(cost[k+stride+1]+(template[i]===dna[j]?0:edit),
      cost[k+stride]+gap,cost[k+1]+gap);
  }
  const events=[];
  let i=0,j=0,last=null;
  while(i<m || j<n){
    const k=i*stride+j;
    // At equal cost, put the gap at the earliest permissible template position.
    const del=i<m && cost[k]===cost[k+stride]+gap;
    const ins=!del && j<n && cost[k]===cost[k+1]+gap;
    if(!del && !ins){i++;j++;last=null;continue}
    const sign=del?'-':'+';
    if(!last || last.sign!==sign){last={pos:i+1,sign,bases:''};events.push(last)}
    last.bases+=del?template[i++]:dna[j++];
  }
  // The secondary gap-base cost is always smaller than one edit weight.
  const edits=Math.floor(cost[0]/edit);
  const indels=events.map(e=>e.pos+e.sign+e.bases).join(' · ');
  return {indels,edits,divergent:events.length>0 && 100*edits>divergencePercent*m};
}

function copyDifference(unit,dna){
  const template=visibleTemplates.get(unit);
  if(!template)return null;
  const key=template+'|'+dna;
  if(!differenceCache.has(key))differenceCache.set(key,templateDifference(template,dna));
  return differenceCache.get(key);
}

function fiveWalk(p){
  return paths[p].flatMap(v=>{
    let start=v.original_interval[0];
    return v.original_gfa_walk.map((id,i)=>{
      const dna=data.variants[v.original_variant_ids[i]],node=nodes[v.supernode_id];
      const token=node.ordered_pattern[i%node.ordered_pattern.length];
      const unit=motifName(token),unknown=token[3]==='unknown';
      const difference=unknown?null:copyDifference(unit,dna);
      const literal=unknown || !!difference?.divergent;
      const repeatKey=!literal && !node.protected && token[3]==='unit' && token[4]==='internal'?JSON.stringify(token):null;
      const step={id:String(id),dna,start,unit,literal,difference,repeatKey};
      start+=dna.length;return step;
    });
  });
}
function foldFiveRuns(walk){
  const result=[];
  for(let i=0;i<walk.length;){
    const first=walk[i];
    let end=i+1;
    while(end<walk.length && first.repeatKey && walk[end].repeatKey===first.repeatKey)end++;
    if(end-i>=3){
      const copies=walk.slice(i,end);
      // Share a loop only for the same ordered original segments and repeat annotation.
      result.push({...first,id:JSON.stringify(['loop',first.repeatKey,copies.map(s=>s.id)]),copies});
    }else{
      for(let j=i;j<end;j++)result.push(walk[j]);
    }
    i=end;
  }
  return result;
}

const svgNS='http://www.w3.org/2000/svg';

function drawFive(){
  const ids=choices.map(s=>s.value).filter(Boolean),colors=new Map(choices.map((s,i)=>[s.value,palette[i]]));
  const legendPaths=el('fiveLegendPaths');
  legendPaths.replaceChildren();
  for(const p of ids){
    const key=document.createElement('span');
    key.textContent=p;key.style.setProperty('--path-color',colors.get(p));legendPaths.append(key);
  }
  for(const s of choices)for(const o of s.options)o.disabled=!!o.value&&o.value!==s.value&&ids.includes(o.value);
  fiveWalks=new Map(ids.map(p=>[p,fiveWalk(p)]));
  drawStructureRows(ids,colors);
  const trace=el('fiveTrace'),previous=trace.value;
  trace.replaceChildren();option(trace,'','全部');
  for(const p of ids)option(trace,p,p);
  trace.value=ids.includes(previous)?previous:'';
  const root=el('fiveCanvas');root.replaceChildren();
  el('fiveSummary').textContent=data.graph.locus+' · '+ids.length+' 条路径';
  if(!ids.length){root.textContent='请选择路径';highlightFivePath();return}
  const displayWalks=new Map([...fiveWalks].map(([p,walk])=>[p,foldFiveRuns(walk)]));
  // Rank only visited GFA segments. Cyclic input retains a distinct displayed occurrence per step.
  const graph=new Map();
  function indexWalks(unroll){
    graph.clear();

      let previous;
      walk.forEach((s,i)=>{
        s.key=unroll?p+':'+i:s.difference?.divergent?JSON.stringify(['literal',s.id,s.unit]):s.id;
        if(!graph.has(s.key))graph.set(s.key,{step:s,visits:[],next:new Set(),degree:0,rank:0});
        const n=graph.get(s.key);n.visits.push({p,s});
        if(previous&&!previous.next.has(n)){previous.next.add(n);n.degree++}
        previous=n;
      });
    }
    const queue=[...graph.values()].filter(n=>!n.degree);
    for(let i=0;i<queue.length;i++)for(const n of queue[i].next){
      n.rank=Math.max(n.rank,queue[i].rank+1);
      if(--n.degree===0)queue.push(n);
    }
    return queue.length===graph.size;
  }
  if(!indexWalks(false))indexWalks(true);
  const columns=[];
  for(const n of graph.values()){
    (columns[n.rank]??=[]).push(n);
    n.members=[...new Set(n.visits.map(v=>v.p))];
    n.order=n.members.reduce((a,p)=>a+ids.indexOf(p),0)/n.members.length;
  }
  const margin=91,terminalInset=51;
  for(const n of graph.values()){
    if(n.step.copies){
      n.half=60;
      continue;
    }
    const annotations=new Map();
    for(const {s} of n.visits){
      const changes=s.literal?'':s.difference?.indels||'';
      annotations.set(s.literal?s.dna:s.unit+(changes?'′':''),changes);
    }
    n.label=[...annotations.keys()].join(' / ');
    n.indels=[...annotations].filter(([,changes])=>changes).map(([unit,changes])=>
      annotations.size===1?changes:unit+' '+changes).join(' / ');
    n.half=Math.max(40,n.label.length*6+8,n.indels.length*5+8);
  }
  const routes=new Map([...displayWalks].map(([p,walk])=>[p,walk.map(s=>graph.get(s.key))]));
  const bypassPaths=ids.filter(p=>{
    const ranks=[-1,...routes.get(p).map(n=>n.rank),columns.length];
    return ranks.some((rank,i)=>i>0 && rank-ranks[i-1]>1);
  });
  const topCount=Math.ceil(bypassPaths.length/2),laneGap=11;
  const topSpace=topCount*laneGap,bottomSpace=(bypassPaths.length-topCount)*laneGap;
  const layers=columns.reduce((n,col)=>Math.max(n,col.length),0);
  const rowGap=[...graph.values()].some(n=>n.step.copies)?130:85;
  const body=Math.max(105,layers*rowGap),mid=topSpace+30+body/2;
  const position=new Map(),edges=[],channels=[];
  const halfWidths=columns.map(col=>col.reduce((h,n)=>Math.max(h,n.half),40));
  const style=getComputedStyle(root);
  const available=root.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-2;
  const fixedWidth=2*margin+halfWidths.reduce((sum,half)=>sum+2*half,0);
  const columnGap=Math.max(44,Math.min(96,(available-fixedWidth)/Math.max(1,columns.length-1)));
  channels.push([terminalInset,margin]);
  let right=margin;
  for(const [index,col] of columns.entries()){
    col.sort((a,b)=>a.order-b.order);
    const half=halfWidths[index];
    const x=right+half;
    col.forEach((n,j)=>position.set(n,{x,y:mid+(j-(col.length-1)/2)*rowGap}));
    channels.push([x+half,x+half+columnGap]);
    right=x+half+columnGap;
  }
  const width=right-columnGap+margin;
  channels.at(-1)[1]=width-terminalInset;
  for(const [p,route] of routes){
    const k=ids.indexOf(p),offset=(k-(ids.length-1)/2)*6;
    const rail=mid+(k-(ids.length-1)/2)*19;
    let prev={x:terminalInset,y:rail,r:-1};
    for(const n of route){
      const pt=position.get(n),to={x:pt.x-n.half,y:pt.y+offset,r:n.rank};
      edges.push({p,a:prev,b:to});
      prev={x:pt.x+n.half,y:pt.y+offset,r:n.rank};
    }
    edges.push({p,a:prev,b:{x:width-terminalInset,y:rail,r:columns.length}});
  }
  const height=topSpace+body+47+bottomSpace;
  const svg=mark(root,'svg',{width,height,viewBox:`0 0 ${width} ${height}`,preserveAspectRatio:'xMidYMid meet',class:'fiveRow',role:'group','aria-label':'五路径位点图'});
  // Give each path a distinct bend position in every column gap.
  function bendX(channel,pathIndex){

  }
  for(const {p,a,b} of edges){
    const k=ids.indexOf(p),leaveX=bendX(a.r+1,k);
    let d=`M ${a.x} ${a.y} H ${leaveX} V ${b.y} H ${b.x}`;
    if(b.r-a.r>1){
      const lane=bypassPaths.indexOf(p),enterX=bendX(b.r,k);
      const shelf=lane<topCount?14+lane*laneGap:topSpace+body+36+(lane-topCount)*laneGap;
      d=`M ${a.x} ${a.y} H ${leaveX} V ${shelf} H ${enterX} V ${b.y} H ${b.x}`;
    }
    mark(svg,'path',{d,fill:'none',stroke:colors.get(p),'stroke-width':2.2,
      'stroke-linecap':'round','data-paths':p});
  }
  for(const [p,walk] of fiveWalks){
    const y=mid+(ids.indexOf(p)-(ids.length-1)/2)*19+4;
    for(const [x,anchor] of [[terminalInset-3,'end'],[width-terminalInset+3,'start']])

  }
  for(const [n,pt] of position){
    const {x,y}=pt,s=n.step,group=mark(svg,'g',{'data-paths':n.members.join(' ')});
    if(s.copies){
      const count=s.copies.length, bp=s.copies.reduce((total,copy)=>total+copy.dna.length,0);
      const ink=n.members.length===1?colors.get(n.members[0]):'#465057';
      const indels=s.copies.map(copy=>copy.difference?.indels||'');
      group.setAttribute('data-loop-copies',count);
      mark(group,'rect',{x:x-n.half,y:y-25,width:2*n.half,height:53,rx:12,fill:'#e3f0ef',stroke:ink});
      const loopLeft=x-26,loopRight=x+26,loopTop=y-53,nodeTop=y-25;
      mark(group,'path',{d:`M ${loopRight} ${nodeTop} V ${loopTop} H ${loopLeft} V ${nodeTop}`,stroke:ink,'stroke-width':2.2,fill:'none'});
      mark(group,'polygon',{points:`${loopLeft-5},${nodeTop-9} ${loopLeft+5},${nodeTop-9} ${loopLeft},${nodeTop}`,fill:ink});
      mark(group,'text',{x,y:loopTop-8,'text-anchor':'middle'},'回环 '+(count-1)+' 次');
      mark(group,'text',{x,y:y-7,'text-anchor':'middle',class:'unit'},s.unit+' ×'+count);
      mark(group,'text',{x,y:y+8,'text-anchor':'middle'},'共 '+bp+' bp');
      if(indels.some(Boolean))
        mark(group,'text',{x,y:y+22,'text-anchor':'middle'},'含插缺');
      mark(group,'title',{},n.members.join('、')+' · 首次进入 1 次，回环 '+(count-1)+' 次\n'+s.copies.map((copy,i)=>(i+1)+'. '+copy.dna+(indels[i]?'  '+indels[i]:'')).join('\n'));
      continue;
    }
    mark(group,'rect',{x:x-n.half,y:y-25,width:2*n.half,height:53,rx:5,fill:s.literal?'#f1efe8':'#eef4f4',stroke:'#829da2','stroke-dasharray':s.literal?'3 2':'none'});
    if(s.difference?.divergent){
      const length=visibleTemplates.get(s.unit).length;
      group.dataset.divergentUnit=s.unit;
      mark(group,'title',{},s.unit+'′ · 编辑距离 '+s.difference.edits+' / 模板 '+length+' bp（'+(100*s.difference.edits/length).toFixed(1)+'%）');
    }
    mark(group,'text',{x,y:y-(n.indels?10:3),'text-anchor':'middle',class:'unit'},n.label);
    mark(group,'text',{x,y:y+(n.indels?4:14),'text-anchor':'middle'},s.dna.length+'bp');
    if(n.indels){
      mark(group,'text',{x,y:y+19,'text-anchor':'middle',class:'indels'},n.indels);
      mark(group,'title',{},'相对简化字典，位置从 1 起算。+ 表示在该位置前插入，− 表示从该位置缺失。等价位置取最左。');
    }
  }
  highlightFivePath();
}
el('fiveCanvas').onclick=e=>{
  const p=e.target.closest('[data-paths]')?.getAttribute('data-paths');
  if(p&&!p.includes(' ')){el('fiveTrace').value=el('fiveTrace').value===p?'':p;highlightFivePath()}
};
el('fiveTrace').onchange=highlightFivePath;
let lastWidth=0;
new ResizeObserver(()=>{
  const width=el('fiveCanvas').clientWidth;
  if(width&&width!==lastWidth){lastWidth=width;drawFive()}
}).observe(el('fiveCanvas'));

startView();
</script></html>
